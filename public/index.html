<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:10px;
}
.track{
  position:relative;
  height:60px;
  border:2px solid #ccc;
  margin:10px 0;
  overflow:hidden;
}
.track::after {
  content: '🏁';
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 40px;
}
.player{
  position:absolute;
  top:10px;
  font-size:40px;
  transition: transform 0.1s linear;
}
button{
  font-size:30px;
  width:100%;
  padding:20px;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
#winner {
  font-size: 50px;
  text-align: center;
  margin: 20px 0;
  padding: 20px;
  background: linear-gradient(45deg, #FFD700, #FFA500);
  border-radius: 10px;
  animation: celebrate 1s ease-in-out infinite;
  display: none;
}
@keyframes celebrate {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
</style>
</head>

<body>

<h2>🏁 どうぶつレース</h2>

<button id="tap">たたく！</button>

<div id="winner"></div>

<div id="field"></div>

<script>
const socket = io();

const room = "family";
const name = ["🐰","🐻","🐱","🐼"][Math.floor(Math.random()*4)];

socket.emit("join",{room,name});

document.getElementById("tap").onclick = ()=>{
  socket.emit("tap",{room});
};

socket.on("state", game=>{

  const field = document.getElementById("field");
  const winnerDiv = document.getElementById("winner");
  const tapButton = document.getElementById("tap");
  
  field.innerHTML="";

  // ゴール判定と勝者表示
  if (game.finished && game.winner) {
    winnerDiv.style.display = "block";
    winnerDiv.innerHTML = `
      <div>🎉 優勝 🎉</div>
      <div style="font-size:80px; margin:10px 0;">${game.winner.name}</div>
      <div>おめでとう！</div>
    `;
    tapButton.disabled = true;
  } else {
    winnerDiv.style.display = "none";
    tapButton.disabled = false;
  }

  Object.values(game.players).forEach(p=>{

    const track = document.createElement("div");
    track.className="track";

    const player = document.createElement("div");
    player.className="player";
    player.textContent=p.name;

    // ← 横に走る部分
    player.style.transform = `translateX(${p.pos}px)`;

    track.appendChild(player);
    field.appendChild(track);
  });
});
</script>

</body>
</html>
