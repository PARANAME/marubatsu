<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/socket.io/socket.io.js"></script>
<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:10px;
}
.track{
  position:relative;
  height:60px;
  border:2px solid #ccc;
  margin:10px 0;
  overflow:hidden;
}
.track::after {
  content: '🏁';
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 40px;
}
.player{
  position:absolute;
  top:10px;
  left:0;
  font-size:40px;
  transition: transform 0.1s linear;
}
button{
  font-size:30px;
  width:100%;
  padding:20px;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.winner {
  font-size: 50px;
  text-align: center;
  margin: 20px 0;
  padding: 20px;
  background: linear-gradient(45deg, #FFD700, #FFA500);
  border-radius: 10px;
  animation: celebrate 1s ease-in-out infinite;
}
@keyframes celebrate {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.reset-button {
  margin-top:10px;
  background:#4CAF50;
  color:white;
}
</style>
</head>

<body>

<div id="app">
  <h2>🏁 どうぶつレース</h2>

  <button @click="tap" :disabled="game.finished">たたく！</button>
  
  <button 
    v-if="game.finished" 
    @click="reset" 
    class="reset-button">
    もう一度遊ぶ！
  </button>

  <!-- 勝者表示 -->
  <div v-if="game.finished && game.winner" class="winner">
    <div>🎉 優勝 🎉</div>
    <div style="font-size:80px; margin:10px 0;">{{ game.winner.name }}</div>
    <div>おめでとう！</div>
  </div>

  <!-- レーストラック -->
  <div id="field" ref="field">
    <div v-for="(player, id) in game.players" :key="id" class="track">
      <div 
        class="player" 
        :style="getPlayerStyle(player)">
        {{ player.name }}
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      socket: null,
      room: "family",
      myName: ["🐰","🐻","🐱","🐼"][Math.floor(Math.random()*4)],
      game: {
        players: {},
        winner: null,
        finished: false
      },
      trackWidth: 800 // デフォルト値
    }
  },
  mounted() {
    // Socket.io接続
    this.socket = io();
    
    // 部屋に参加
    this.socket.emit("join", {
      room: this.room,
      name: this.myName
    });

    // サーバーから状態を受信
    this.socket.on("state", (gameState) => {
      this.game = gameState;
      // 状態更新時にトラック幅を更新（DOMが更新された後）
      this.$nextTick(() => {
        this.updateTrackWidth();
      });
    });

    // 初期のトラック幅を設定
    this.$nextTick(() => {
      this.updateTrackWidth();
    });
    
    // リサイズ対応
    window.addEventListener('resize', this.updateTrackWidth);
  },
  beforeUnmount() {
    window.removeEventListener('resize', this.updateTrackWidth);
  },
  methods: {
    tap() {
      this.socket.emit("tap", { room: this.room });
    },
    reset() {
      this.socket.emit("reset", { room: this.room });
    },
    updateTrackWidth() {
      // トラック要素を取得
      const trackElement = document.querySelector('.track');
      if (trackElement) {
        // トラック全体の幅から、ゴール旗のスペース（60px）とプレイヤーの幅（40px）を引く
        this.trackWidth = trackElement.clientWidth - 100;
      }
    },
    getPlayerStyle(player) {
      // パーセンテージをピクセルに変換
      const position = (player.pos / 100) * this.trackWidth;
      return {
        transform: `translateX(${position}px)`
      };
    }
  }
}).mount('#app');
</script>

</body>
</html>
