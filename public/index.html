<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/socket.io/socket.io.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:10px;
}
.track{
  position:relative;
  height:60px;
  border:2px solid #ccc;
  margin:10px 0;
  overflow:hidden;
}
.player{
  position:absolute;
  top:10px;
  font-size:40px;
  transition: transform 0.1s linear;
}
button{
  font-size:30px;
  width:100%;
  padding:20px;
}
</style>
</head>

<body>

<h2>🏁 どうぶつレース</h2>

<button id="tap">たたく！</button>

<div id="field"></div>

<script>
const socket = io();

const room = "family";
const name = ["🐰","🐻","🐱","🐼"][Math.floor(Math.random()*4)];

socket.emit("join",{room,name});

document.getElementById("tap").onclick = ()=>{
  socket.emit("tap",{room});
};

socket.on("state", game=>{

  const field = document.getElementById("field");
  field.innerHTML="";

  Object.values(game.players).forEach(p=>{

    const track = document.createElement("div");
    track.className="track";

    const player = document.createElement("div");
    player.className="player";
    player.textContent=p.name;

    // ← 横に走る部分
    player.style.transform = `translateX(${p.pos}px)`;

    track.appendChild(player);
    field.appendChild(track);
  });
});
</script>

</body>
</html>
