<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/socket.io/socket.io.js"></script>
<!-- Vue 3 CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body{
  font-family:sans-serif;
  padding:10px;
  background: linear-gradient(to bottom, #87CEEB 0%, #98D8E8 100%);
  min-height: 100vh;
  margin: 0;
}

#app {
  max-width: 800px;
  margin: 0 auto;
}

h2 {
  text-align: center;
  font-size: 2.5em;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  margin: 20px 0;
}

.track{
  position:relative;
  height:60px;
  border:2px solid #ccc;
  margin:10px 0;
  overflow:visible;
  background: linear-gradient(to right, #90EE90 0%, #98FB98 100%);
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.track::after {
  content: '🏁';
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 40px;
}

.player{
  position:absolute;
  top:10px;
  left:0;
  font-size:40px;
  transition: transform 0.1s linear;
  filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));
}

/* タップ時のジャンプアニメーション */
.player.jumping {
  animation: jump 0.3s ease;
}

@keyframes jump {
  0%, 100% { 
    top: 10px;
  }
  50% { 
    top: -5px;
  }
}

/* 追い抜き時のキラキラエフェクト */
.sparkle {
  position: absolute;
  pointer-events: none;
  font-size: 30px;
  animation: sparkleAnimation 0.8s ease-out forwards;
}

@keyframes sparkleAnimation {
  0% {
    opacity: 1;
    transform: translate(0, 0) scale(0.5) rotate(0deg);
  }
  100% {
    opacity: 0;
    transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(360deg);
  }
}

/* タップボタンのスタイル */
.tap-button{
  font-size: 40px;
  width: 100%;
  padding: 30px;
  background: linear-gradient(145deg, #FF6B6B, #FF5252);
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 8px 15px rgba(255, 82, 82, 0.3);
  transition: all 0.1s ease;
  font-weight: bold;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  position: relative;
  overflow: hidden;
}

.tap-button:active:not(:disabled) {
  transform: scale(0.95);
  box-shadow: 0 4px 8px rgba(255, 82, 82, 0.3);
}

.tap-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  background: linear-gradient(145deg, #999, #888);
}

/* タップ時のリップルエフェクト */
.ripple {
  position: absolute;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  transform: scale(0);
  animation: ripple-animation 0.6s ease-out;
  pointer-events: none;
}

@keyframes ripple-animation {
  to {
    transform: scale(4);
    opacity: 0;
  }
}

.winner {
  font-size: 50px;
  text-align: center;
  margin: 20px 0;
  padding: 20px;
  background: linear-gradient(45deg, #FFD700, #FFA500);
  border-radius: 10px;
  animation: celebrate 1s ease-in-out infinite;
  box-shadow: 0 5px 15px rgba(255, 165, 0, 0.4);
}

@keyframes celebrate {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.reset-button {
  margin-top:10px;
  background: linear-gradient(145deg, #4CAF50, #45a049);
  color:white;
  font-size: 30px;
  padding: 20px;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 5px 10px rgba(76, 175, 80, 0.3);
  transition: all 0.2s ease;
  font-weight: bold;
}

.reset-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 15px rgba(76, 175, 80, 0.4);
}

.reset-button:active {
  transform: translateY(0);
}
</style>
</head>

<body>

<div id="app">
  <h2>🏁 どうぶつレース 🏁</h2>

  <button 
    class="tap-button"
    @click="tap" 
    @mousedown="createRipple"
    :disabled="game.finished">
    💥 たたく！ 💥
  </button>
  
  <button 
    v-if="game.finished" 
    @click="reset" 
    class="reset-button">
    🔄 もう一度遊ぶ！
  </button>

  <!-- 勝者表示 -->
  <div v-if="game.finished && game.winner" class="winner">
    <div>🎉 優勝 🎉</div>
    <div style="font-size:80px; margin:10px 0;">{{ game.winner.name }}</div>
    <div>おめでとう！</div>
  </div>

  <!-- レーストラック -->
  <div id="field" ref="field">
    <div v-for="(player, id) in game.players" :key="id" class="track">
      <div 
        :class="['player', { jumping: jumpingPlayers[id] }]"
        :style="getPlayerStyle(player)"
        :ref="el => { if (el) playerRefs[id] = el }">
        {{ player.name }}
      </div>
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      socket: null,
      room: "family",
      myName: ["🐰","🐻","🐱","🐼"][Math.floor(Math.random()*4)],
      game: {
        players: {},
        winner: null,
        finished: false
      },
      trackWidth: 800,
      jumpingPlayers: {},
      playerRefs: {},
      previousPositions: {}
    }
  },
  mounted() {
    this.socket = io();
    
    this.socket.emit("join", {
      room: this.room,
      name: this.myName
    });

    this.socket.on("jumped", ({ id }) => {
      this.jumpingPlayers[id] = true;
      setTimeout(() => {
        this.jumpingPlayers[id] = false;
      }, 300);
    });

    this.socket.on("state", (gameState) => {
      this.checkOvertakes(gameState);
      this.game = gameState;
      
      this.$nextTick(() => {
        this.updateTrackWidth();
      });
    });

    this.$nextTick(() => {
      this.updateTrackWidth();
    });
    
    window.addEventListener('resize', this.updateTrackWidth);
  },
  beforeUnmount() {
    window.removeEventListener('resize', this.updateTrackWidth);
  },
  methods: {
    tap() {
      this.socket.emit("tap", { room: this.room });
      
      const myPlayerId = this.socket.id;
      this.jumpingPlayers[myPlayerId] = true;
      
      setTimeout(() => {
        this.jumpingPlayers[myPlayerId] = false;
      }, 300);
    },
    reset() {
      this.socket.emit("reset", { room: this.room });
      this.previousPositions = {};
    },
    createRipple(event) {
      if (this.game.finished) return;
      
      const button = event.currentTarget;
      const ripple = document.createElement('span');
      const rect = button.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = event.clientX - rect.left - size / 2;
      const y = event.clientY - rect.top - size / 2;
      
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = x + 'px';
      ripple.style.top = y + 'px';
      ripple.classList.add('ripple');
      
      button.appendChild(ripple);
      
      setTimeout(() => {
        ripple.remove();
      }, 600);
    },
    updateTrackWidth() {
      const trackElement = document.querySelector('.track');
      if (trackElement) {
        this.trackWidth = trackElement.clientWidth - 100;
      }
    },
    getPlayerStyle(player) {
      const position = (player.pos / 100) * this.trackWidth;
      return {
        transform: `translateX(${position}px)`
      };
    },
    checkOvertakes(newGameState) {
      if (Object.keys(this.previousPositions).length === 0) {
        Object.keys(newGameState.players).forEach(id => {
          this.previousPositions[id] = newGameState.players[id].pos;
        });
        return;
      }
      
      Object.keys(newGameState.players).forEach(id => {
        const oldPos = this.previousPositions[id] || 0;
        const newPos = newGameState.players[id].pos;
        
        if (newPos > oldPos) {
          Object.keys(newGameState.players).forEach(otherId => {
            if (id !== otherId) {
              const otherOldPos = this.previousPositions[otherId] || 0;
              const otherNewPos = newGameState.players[otherId].pos;
              
              if (oldPos <= otherOldPos && newPos > otherNewPos) {
                this.createSparkle(id);
              }
            }
          });
        }
        
        this.previousPositions[id] = newPos;
      });
    },
    createSparkle(playerId) {
      this.$nextTick(() => {
        const playerElement = this.playerRefs[playerId];
        if (!playerElement) return;
        
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            const sparkle = document.createElement('div');
            sparkle.textContent = '✨';
            sparkle.className = 'sparkle';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 30 + Math.random() * 20;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            sparkle.style.setProperty('--tx', `${tx}px`);
            sparkle.style.setProperty('--ty', `${ty}px`);
            sparkle.style.left = '50%';
            sparkle.style.top = '50%';
            
            playerElement.appendChild(sparkle);
            
            setTimeout(() => {
              sparkle.remove();
            }, 800);
          }, i * 100);
        }
      });
    }
  }
}).mount('#app');
</script>

</body>
</html>
